<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Car Repo Page</title>
    <link rel="stylesheet" href="css/datatable.css">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>

<body>
    <h1>Coches</h1>

    <div id="carview">
        <h2>Tabla de coches</h2>

        <input type="text" id="searchbar" onkeyup="search()" placeholder="Buscar coche por matricula...">

        <p id="counter">0 coches</p>
        <table>
            <tr>
                <th>Matricula</th>
                <th>Kilometros</th>
                <th>Propietario</th>
                <th>Modelo</th>
                <th>Color</th>
                <th colspan="2">Botones</th>
            </tr>
            <tbody id="cars"></tbody>
        </table>

        <button id="showaddform" onclick="_displayView('addform'), _hideView('carview')">Añadir coche</button>
        <button id="goback" onclick="location.href='index.html'">Volver al inicio</button>
    </div>

    <div id="addform">

        <h2>Añadir un nuevo coche</h2>
        <form action="javascript:void(0);" method="POST" onsubmit="addCar()">
            <input type="text" id="add-license" placeholder="Matricula">
            <input type="number" id="add-kms" placeholder="Kilometros">
            <input list="ownerlist" id="add-owner" placeholder="Propietario">
            <input list="makelist" id="add-make" placeholder="Modelo">
            <input list="colorlist" id="add-color" placeholder="Color">
        </form>
        <button class="submit" onclick="addCar()">Añadir</button>
        <button class="cancel" onclick="cancelAction('addform')">Cancelar</button>
    </div>

    <div id="editform">

        <h2>Editar un coche</h2>
        <form action="javascript:void(0);" method="PUT" onsubmit="editCar()">
            <input type="text" id="edit-id" disabled hidden>
            <input type="text" id="edit-license" placeholder="Matricula">
            <input type="number" id="edit-kms" placeholder="Kilometros">
            <input list="ownerlist" id="edit-owner" placeholder="Propietario">
            <input list="makelist" id="edit-make" placeholder="Modelo">
            <input list="colorlist" id="edit-color" placeholder="Color">
        </form>
        <button class="submit" onclick="editCar()">Editar</button>
        <button class="cancel" onclick="cancelAction('editform')">Cancelar</button>
    </div>


    <datalist id="ownerlist"></datalist>
    <datalist id="makelist"></datalist>
    <datalist id="colorlist"></datalist>

    <script src="js/cars.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getOwners();
        getMakes();
        getColors();
        getCars();
    </script>
</body>

</html>
