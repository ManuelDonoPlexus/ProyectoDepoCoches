<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Car Repo Page</title>
    <link rel="stylesheet" href="css/datatable.css">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>

<body>
    <h1>Propietarios</h1>

    <div id="ownerview">
        <table>
            <h2>Tabla de propietarios</h2>

            <input type="text" id="searchbar" onkeyup="search()" placeholder="Buscar marca por propietario...">

            <p id="counter">0 propietarios</p>
            <tr>
                <th>Nombre</th>
                <th>Fecha de Entrada</th>
                <th>Dirección de Correo</th>
                <th>Número de Telefono</th>
                <th colspan="2">Botones</th>
            </tr>
            <tbody id="owners"></tbody>
        </table>

        <button id="showaddform" onclick="_displayView('addform'), _hideView('ownerview')">Añadir propietario</button>
        <button id="goback" onclick="location.href='index.html'">Volver al inicio</button>
    </div>

    <div id="addform">

        <h2>Añadir un nuevo propietario</h2>
        <form action="javascript:void(0);" method="POST" onsubmit="addOwner()">
            <input type="text" id="add-name" placeholder="Nombre">
            <input type="date" id="add-date" placeholder="Fecha">
            <input type="email" id="add-email" placeholder="Email">
            <input type="number" id="add-phone" placeholder="Telefono">
        </form>
        <button class="submit" onclick="addOwner()">Añadir</button>
        <button class="cancel" onclick="cancelAction('addform')">Cancelar</button>
    </div>

    <div id="editform">

        <h2>Editar un nuevo propietario</h2>
        <form action="javascript:void(0);" method="PUT" onsubmit="editOwner()">
            <input type="text" id="edit-id" disabled hidden>
            <input type="text" id="edit-name" placeholder="Nombre">
            <input type="date" id="edit-date" placeholder="Fecha">
            <input type="email" id="edit-email" placeholder="Email">
            <input type="tel" id="edit-phone" placeholder="Telefono">
        </form>
        <button class="submit" onclick="editOwner()">Editar</button>
        <button class="cancel" onclick="cancelAction('editform')">Cancelar</button>
    </div>


    <script src="js/owners.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getOwners();
    </script>
</body>

</html>
